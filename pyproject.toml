[project]
name = "ness_demo"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.12.10",
    "dagster-snowflake",
    "dagster-dbt",
    "dagster-databricks",
    "dagster-azure",
    "pandas",
    "snowflake-connector-python",
    "fintech_alpha",
    "insurance_beta",
    "healthcare_gamma",
    "shared",
    "shared_analytics",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.uv.sources]
fintech_alpha = { path = "code_locations/fintech_alpha", editable = true }
insurance_beta = { path = "code_locations/insurance_beta", editable = true }
healthcare_gamma = { path = "code_locations/healthcare_gamma", editable = true }
shared = { path = "code_locations/shared", editable = true }
shared_analytics = { path = "code_locations/shared_analytics", editable = true }


