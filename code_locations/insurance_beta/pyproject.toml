[project]
name = "insurance_beta"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.12.10",
    "dagster-cloud",
    "dagster-azure",
    "dagster-databricks",
    "pandas",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "insurance_beta"
registry_modules = [
    "insurance_beta.components.*",
]
